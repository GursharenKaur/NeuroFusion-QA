[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofusion-qa"
version = "0.1.0"
description = "IdentityGuard-BIDS research implementation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pybids",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]