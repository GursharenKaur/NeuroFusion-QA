protocol:
  name: identityguard-bids-isbi2027
  version: "0.1"
  status: draft_until_G1
  owner: "[STUDENT]"
  approved_by: "[PI]"
  approved_date: null

identity:
  person_key:
    - dataset_namespace
    - dataset_version
    - participant_id
  acquisition_key:
    - dataset_namespace
    - dataset_version
    - participant_id
    - session_id
    - modality
    - task
    - acquisition
    - run
  preserve_raw_labels: true
  infer_cross_dataset_identity: false
  missing_namespace_severity: ERROR

invariants:
  namespace_and_injectivity: true
  join_cardinality: true
  cross_modal_pairing: true
  derivative_lineage_and_duplication: true
  split_independence: true
  metric_denominator_traceability: true
  fail_on_many_to_many: true

datasets:
  - namespace: "openneuro:ds000117"
    version: "1.1.0"
    doi: "10.18112/openneuro.ds000117.v1.1.0"
    role: required_real_manifest
    expected_human_participants: 16
    exclude_from_person_count:
      - sub-emptyroom
  - namespace: "openneuro:ds004796"
    version: "1.1.0"
    doi: "10.18112/openneuro.ds004796.v1.1.0"
    role: optional_metadata_only
    enabled: false

corruptions:
  types:
    - C1_namespace_stripping
    - C2_canonicalization_collision
    - C3_duplicate_propagation
    - C4_cross_modal_permutation
    - C5_subject_split_leakage
    - C6_denominator_mismatch
  synthetic_affected_fractions: [0.01, 0.05, 0.10, 0.25]
  real_affected_counts: [1, 2, 4]
  seeds: 100
  master_seed: 20270915

synthetic_grid:
  people: [16, 64, 256, 1024, 4096]
  modalities: [2, 3]
  sessions: [1, 2]
  runs_per_modality: [1, 4]

statistics:
  confidence_level: 0.95
  paired_bootstrap_resamples: 10000
  bootstrap_unit: corruption_instance
  report_numerators_denominators: true

optional_sentinel:
  enabled: false
  minimum_paired_people: 12
  outer_split: leave_one_subject_out
  model: multinomial_logistic_regression
  fusion: mean_calibrated_probabilities
  allow_deep_learning: false

boundaries:
  protected_cohort_access: false
  ds004504_to_ds004796_join: false
  reuse_n01_results: false
  reuse_legacy_biomedical_metrics: false

